name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is intentionally absent: ubuntu-latest (24.04) no longer ships it
        # in the runner tool cache and setup-python fails before the tests run.
        # Use an ubuntu-22.04 matrix entry if 3.9 support has to be verified.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Smoke test on the sample log
        run: python -m authwatch.cli data/sample_auth.log --year 2026 --fail-on none
